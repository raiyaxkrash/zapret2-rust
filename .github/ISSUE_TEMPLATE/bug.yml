name: Что-то не работает
description: Обход не включается, сервис не открывается, приложение ведёт себя странно
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете о проблеме! Перед отправкой попробуйте:
        1. «Стратегии» → «Подобрать автоматически» → «Применить».
        2. Выключить **QUIC / HTTP3** на главной и повторить подбор.
        3. Проверить карантин антивируса: иногда он удаляет драйвер WinDivert.
  - type: dropdown
    id: what
    attributes:
      label: Что не работает
      multiple: true
      options:
        - YouTube
        - Discord (сайт или приложение)
        - Голос Discord
        - Мои сайты / наборы сайтов
        - Обход не включается
        - Обновление
        - Интерфейс
        - Другое
    validations:
      required: true
  - type: textarea
    id: describe
    attributes:
      label: Что происходит
      description: Что вы делали, чего ожидали и что получилось.
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Результат подбора стратегии
      description: Строки из подбора, например «YouTube 0/4 · Остальные 3/3».
      render: text
  - type: textarea
    id: log
    attributes:
      label: Журнал
      description: Вкладка «Журнал» → «Копировать». Можно включить «Подробный журнал» в настройках.
      render: text
  - type: input
    id: version
    attributes:
      label: Версия приложения
      description: Настройки → Обновления → Приложение
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Провайдер и город
      description: Например, «Ростелеком, Москва» или «МТС, мобильный интернет». Это помогает подобрать стратегии.
  - type: dropdown
    id: os
    attributes:
      label: Windows
      options:
        - Windows 11
        - Windows 10
        - Windows 11 ARM64
