name: stats

# Раз в сутки собирает статистику по счётчикам скачиваний GitHub (без телеметрии)
# и сохраняет её в ветку stats: README.md и history.csv.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ветка stats
        run: |
          git fetch origin stats || true
          if git rev-parse --verify origin/stats >/dev/null 2>&1; then
            git worktree add out origin/stats
            git -C out checkout -B stats
          else
            git worktree add --detach out
            git -C out checkout --orphan stats
            git -C out rm -rf --quiet .
          fi

      - name: Сбор статистики
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/stats.py out

      - name: Сохранение
        run: |
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md history.csv
          git diff --cached --quiet || git commit -m "Статистика за $(date -u +%F)"
          git push origin stats
